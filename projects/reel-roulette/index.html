<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1B1B1B">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Reel Roulette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage.woff2") format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Figtree";src:url("fonts/figtree.woff2") format("woff2");font-weight:300 900;font-display:swap}
:root{
  --ink:#1B1B1B; --ink-2:#252525; --ink-3:#2F2F2F; --line:#3C3C3C;
  --text:#F2F2F2; --muted:#A9A9A9;
  --accent:#E5A00D; --accent-ink:#1B1B1B;
  --coral:#FF6B57; --amber:var(--accent); --mint:#2ED3A0; --sky:#4C9DFF; --violet:#9A7CFF; --rose:#FF6FB0;
  --p0:var(--coral); --p1:var(--sky);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.app{max-width:520px;margin:0 auto;box-sizing:border-box;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 16px;
  display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none;display:block}
.brand h1{font:800 21px/1 var(--display);letter-spacing:-.02em;margin:0}
.brand small{display:block;font:500 12px/1.2 var(--body);color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;flex:none}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ink-2);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}
.challenge-btn{height:42px;padding:0 16px 0 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:var(--ink-2);border:1px solid var(--line)}
.vs{display:flex}
.vs i{width:12px;height:12px;border-radius:50%;background:var(--p0);border:2px solid var(--ink-2)}
.vs i+i{background:var(--p1);margin-left:-5px}

.notice{font-size:13px;color:var(--muted);background:var(--ink-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:0;line-height:1.45}
.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notice span{flex:1 1 200px;min-width:0}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.notice .btn.primary{grid-column:auto}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--display);color:#161616;flex:none}
.av.sm{width:30px;height:30px;font-size:13px}
#acctBtn .av{width:32px;height:32px}
.settings{align-items:stretch}
.set-body{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:4px}
.sheet .set-h{margin:10px 0 0;font:800 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.acct{display:flex;align-items:center;gap:12px}
.acct .av{width:44px;height:44px;font-size:18px}
.acct b,.people b{display:block;font-size:16px}
.acct small,.people small{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field select,.addg input,#pinInput{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text);font-size:15px;min-width:0}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.people li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.people li>div{flex:1}
.people .av{width:34px;height:34px;font-size:14px}
.addg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.addg .btn{padding:0 16px}
.fine{margin:6px 0 0;font-size:12px;color:var(--muted)}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),460px);box-sizing:border-box;
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:#333;border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:14px;animation:rise2 .25s}
.toast span{flex:1}
.toast .textbtn{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(8,8,8,.7);padding:16px}
#pinInput{font:800 28px/1 var(--display);letter-spacing:.5em;text-align:center}
.namepick{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.namepick button{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--ink-3);text-transform:none;letter-spacing:0;color:var(--text)}
.notice.err{border-style:solid;border-color:rgba(255,107,87,.5);color:var(--text)}

/* type switch */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{height:42px;border-radius:12px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}

/* filters */
.filters{background:var(--ink-2);border:1px solid var(--line);border-radius:16px}
.filters summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.filters summary::-webkit-details-marker{display:none}
.filters summary .lbl{font-weight:700}
.filters summary .skipped{flex:1;min-width:0;text-align:right;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters summary .chev{width:16px;height:16px;flex:none;transition:transform .2s}
.filters[open] summary .chev{transform:rotate(180deg)}
.filters .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.help{margin:0;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;background:var(--ink-3)}
.chip.exc{background:rgba(255,107,87,.12);border-color:rgba(255,107,87,.6);color:var(--coral);text-decoration:line-through}
.chip.exc::before{content:"✕";font-size:10px;text-decoration:none;display:inline-block}
.chip.inc{background:rgba(46,211,160,.14);border-color:rgba(46,211,160,.7);color:var(--mint)}
.chip.inc::before{content:"✓";font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.frow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.switch input{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.textbtn{font-size:13px;font-weight:600;color:var(--muted);padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

/* wheel */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px}
.wheel-wrap{position:relative;width:min(100%,420px);aspect-ratio:1;max-width:100%;margin-block:auto}
.wheel-wrap::before{content:"";position:absolute;inset:6%;border-radius:50%;
  background:conic-gradient(var(--coral),var(--amber),var(--mint),var(--sky),var(--violet),var(--rose),var(--coral));
  filter:blur(38px);opacity:.32;z-index:0}
#wheel{position:relative;z-index:1;width:100%;height:100%;display:block}
.pointer{position:absolute;top:-4px;left:50%;width:34px;height:42px;margin-left:-17px;z-index:3;transform-origin:50% 13px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));will-change:transform}
@keyframes tick{40%{transform:rotate(-14deg)}}
.hub{position:absolute;z-index:2;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--ink);border:4px solid var(--accent);color:var(--text);font:800 clamp(17px,5vw,22px)/1 var(--display);letter-spacing:.06em;
  box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 4px var(--ink);transition:transform .15s}
.hub:active{transform:translate(-50%,-50%) scale(.95)}
.hub:disabled{cursor:default;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:stretch}
.toolbar.solo{grid-template-columns:minmax(0,1fr)}
.pwrap{position:relative;min-width:0}
.pbtn,.csel{height:46px;box-sizing:border-box;border-radius:14px;border:1px solid var(--line);background:var(--ink-2);display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.pbtn{padding:0 12px 0 7px;max-width:100%}
.pbtn .who{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.15}
.pbtn .who small{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pbtn .who b{font-size:14px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .av{width:32px;height:32px;font-size:13px}
.chev-s{width:14px;height:14px;flex:none;color:var(--muted)}
.pmenu{position:absolute;z-index:35;top:calc(100% + 6px);left:0;min-width:240px;max-width:calc(100vw - 32px);max-height:min(60vh,420px);overflow:auto;box-sizing:border-box;
  background:#2A2A2A;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:rise2 .18s}
.pmenu h3{margin:6px 10px 6px;font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pmenu button{width:100%;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;text-align:left}
.pmenu button:hover,.pmenu button:focus-visible{background:var(--ink-3)}
.pmenu button[aria-checked="true"]{background:rgba(229,160,13,.14)}
.pmenu button[aria-checked="true"]::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:800}
.pmenu .av{width:34px;height:34px;font-size:14px}
.pmenu .nm{display:flex;flex-direction:column;min-width:0}
.pmenu .nm b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmenu .nm small{font-size:12px;color:var(--muted)}
.pmenu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pmenu .manage{color:var(--accent);font-weight:700;font-size:14px;padding:10px}
.csel{position:relative;padding:0 12px;min-width:0}
.csel .ci{width:18px;height:18px;flex:none;color:var(--accent)}
.csel .cl{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.15;pointer-events:none}
.csel .cl small{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.csel .cl b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csel.on{border-color:var(--accent)}
.csel{text-align:left;width:100%}
/* collection sheet */
.cpick{position:fixed;inset:0;z-index:50;background:rgba(8,8,8,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.cpick-in{position:absolute;left:0;right:0;margin:0 auto;max-width:520px;box-sizing:border-box;
  top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  margin-inline:max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px));
  background:var(--ink-2);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;animation:rise2 .25s}
@media (min-width:540px){.cpick-in{margin-inline:auto}}
.cpick-h{display:flex;align-items:center;gap:12px;padding:16px 14px 10px 18px}
.cpick-h h2{margin:0;flex:1;font:800 20px/1 var(--display);letter-spacing:-.01em}
.cpick-h .sheet-x{position:static!important}
.cpick-s{margin:0 14px 8px;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--text)}
.cpick-list{flex:1;overflow:auto;padding:0 8px 10px;overscroll-behavior:contain}
.cpick-list h3{position:sticky;top:0;z-index:1;margin:0;padding:12px 10px 6px;background:var(--ink-2);font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cpick-list button{width:100%;display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;text-align:left;font-size:14px;font-weight:500;color:var(--text)}
.cpick-list button:hover,.cpick-list button:focus-visible{background:var(--ink-3)}
.cpick-list button[aria-checked="true"]{background:rgba(229,160,13,.14);font-weight:700}
.cpick-list button[aria-checked="true"]::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:800}
.cpick-list .none{padding:18px 10px;color:var(--muted);font-size:14px}
/* challenge menu */
.card.chal{padding:0;gap:0;max-height:100%;overflow:hidden;align-self:center}
.chal-head{padding:20px 20px 14px;display:flex;flex-direction:column;gap:14px;flex:none;border-bottom:1px solid var(--line)}
.chal-games{flex:1;min-height:0;overflow:auto;padding:14px 20px;overscroll-behavior:contain;touch-action:pan-y}
.chal-foot{flex:none;padding:12px 20px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;border-top:1px solid var(--line)}
.chal-foot .btn{height:46px}
.chal-foot .btn.primary{grid-column:auto}
.chal-foot .btn svg{width:18px;height:18px;flex:none}
.players{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pl{display:flex;flex-direction:column;gap:6px;min-width:0}
.pl>span{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pl>span i{width:9px;height:9px;border-radius:50%}
.plbtn{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px 0 6px;border-radius:12px;border:1px solid var(--line);background:var(--ink);font-weight:600;font-size:14px;min-width:0}
.plbtn b{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plbtn .av{width:30px;height:30px;font-size:12px}
.pmenu.floating{position:fixed;z-index:96;top:0;left:0;min-width:220px}
.pmenu .typein{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:6px 4px 4px}
.pmenu .typein input{min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;color:var(--text)}
.pmenu .typein button{width:auto;padding:0 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;justify-content:center}
/* Dos */
.dos{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.dos .pile{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dos .hand{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:100%}
.dcard{width:clamp(46px,13vw,60px);aspect-ratio:2/3;border-radius:10px;display:grid;place-items:center;font:800 clamp(22px,7vw,30px)/1 var(--display);color:#161616;
  border:3px solid #F2F2F2;box-shadow:0 6px 14px rgba(0,0,0,.35);position:relative;transition:transform .15s,opacity .15s}
.dcard::after{content:"";position:absolute;inset:18% 12%;border-radius:50%;border:2px solid rgba(255,255,255,.35);transform:rotate(-30deg)}
.dcard.sm{width:44px;font-size:22px}
.hand .dcard{cursor:pointer}
.hand .dcard.ok{transform:translateY(-6px)}
.hand .dcard.no{opacity:.4}
.dos.wait .hand .dcard{opacity:.55;transform:none}
.dos .row{display:flex;gap:8px}
.dos .row .btn{height:40px;padding:0 16px;font-size:14px}
.dos .turn{margin:0;font:800 22px/1 var(--display)}
.dos.wait .turn{color:var(--muted);font-size:17px}
.dosflash{font:800 54px/1 var(--display);color:var(--accent);animation:slam .45s cubic-bezier(.3,1.6,.5,1)}
/* Color clash */
.clash{font:800 clamp(44px,15vw,72px)/1 var(--display);letter-spacing:-.02em;min-height:1em}
.pips{display:flex;gap:8px}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.csel select{display:none}
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.profiles{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.profiles>span{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pchips{display:flex;gap:8px;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 5px;border-radius:999px;border:1px solid var(--line);background:var(--ink-2);font-weight:600;font-size:14px}
.pchip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--display);color:var(--ink)}
.pchip[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.poolline{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.poolline b{color:var(--text)}

/* result sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,8,8,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92%;overflow:auto;box-sizing:border-box;
  background:var(--ink-2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;gap:12px;animation:rise .4s cubic-bezier(.2,.9,.3,1.1)}
.sheet-bg{position:absolute;left:0;right:0;top:0;height:260px;background-size:cover;background-position:center;filter:blur(34px) saturate(1.3);opacity:.45;
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);pointer-events:none;border-radius:26px 26px 0 0}
.sheet>*:not(.sheet-bg){position:relative}
.sheet-x{position:absolute!important;top:12px;right:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,20,.55);border:1px solid var(--line);z-index:2}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin-top:-10px}
.poster{width:100%;aspect-ratio:2/3;border-radius:12px;overflow:hidden;box-shadow:0 22px 44px rgba(0,0,0,.55);background:var(--ink-3);animation:flip .6s .1s both cubic-bezier(.2,.9,.3,1.2)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.gp{container-type:inline-size;width:100%;height:100%;position:relative;overflow:hidden;display:block;color:#fff}
.gp>*{position:absolute}
.gp .sun{width:44cqw;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,248,230,.95) 0 34%,rgba(255,236,190,.35) 52%,rgba(255,236,190,0) 72%)}
.gp .hill{inset:0}
.gp .grain{inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.55) 100%)}
.gp .t{left:8cqw;right:8cqw;top:8cqw;font:800 15cqw/.95 var(--display);letter-spacing:-.02em;text-wrap:balance;text-shadow:0 1cqw 4cqw rgba(0,0,0,.35);overflow-wrap:anywhere}
.gp .k{left:8cqw;right:8cqw;bottom:15cqw;font:700 5.2cqw/1 var(--body);letter-spacing:.24em;text-transform:uppercase;text-align:center;opacity:.85}
.gp .bill{left:14cqw;right:14cqw;bottom:6cqw;height:5cqw;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.45)) top/100% 1.1cqw no-repeat,linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3)) bottom/72% 1.1cqw no-repeat}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.sheet h2{margin:0;font:800 clamp(21px,6vw,26px)/1.05 var(--display);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.facts{margin:0;color:var(--muted);font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--ink-3);border:1px solid var(--line)}
.r-head{display:grid;grid-template-columns:minmax(0,clamp(96px,30vw,128px)) minmax(0,1fr);gap:16px;align-items:center;width:100%;margin-top:6px}
.r-meta{display:flex;flex-direction:column;gap:7px;min-width:0;padding-right:26px}
.r-sum{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.summary{margin:0;font-size:14.5px;line-height:1.5;color:#D8D8D8;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.summary.open{display:block}
.more{padding:2px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.sheet .btn{height:46px}
.btn{height:50px;border-radius:14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
  background:var(--ink-3);border:1px solid var(--line);color:var(--text);box-sizing:border-box}
.btn.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary[aria-disabled="true"]{background:var(--ink-3);color:var(--muted);border-color:var(--line);pointer-events:none}
.note{margin:0;font-size:12px;color:var(--muted);text-align:center}
@keyframes rise{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes flip{from{transform:perspective(600px) rotateY(-80deg) scale(.8);opacity:0}}

/* challenge arena */
.arena{position:fixed;inset:0;z-index:60;background:var(--ink);display:grid;grid-template-rows:1fr auto 1fr;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.half{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;overflow:hidden;box-sizing:border-box;
  padding:16px max(16px,env(safe-area-inset-left,0px));transition:background .15s}
.half.p0{background:radial-gradient(circle at 50% 75%,rgba(255,107,87,.18),transparent 70%);color:var(--text);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.half.p1{background:radial-gradient(circle at 50% 75%,rgba(76,157,255,.18),transparent 70%);transform:rotate(180deg);padding-bottom:calc(16px + env(safe-area-inset-top,0px))}
.half.wait{background:#242424}
.half.go{background:var(--mint);color:var(--ink)}
.half.win{background:radial-gradient(circle at 50% 50%,rgba(255,180,63,.28),transparent 75%)}
.half .who{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.half.p0 .who{color:var(--p0)} .half.p1 .who{color:var(--p1)}
.count{font:800 120px/1 var(--display);animation:pulse .7s ease-out}
@keyframes pulse{from{transform:scale(1.5);opacity:0}}
.big{font:800 44px/1 var(--display);margin:0;letter-spacing:-.02em}
.hint{margin:0;color:var(--muted);font-size:15px}
.half.go .hint{color:var(--ink)}
.mid{position:relative;z-index:4;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink-2);border-block:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.score{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-width:0}
.score.top{transform:rotate(180deg)}
.score .dot{width:10px;height:10px;border-radius:50%;flex:none}
.score .nm{max-width:28vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score b{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums}
.exit{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ink-3);border:1px solid var(--line);flex:none}
#hockey{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none}
.arena.hockey .mid{background:transparent;border-color:transparent;pointer-events:none}
.arena.hockey .mid .exit{pointer-events:auto}
.arena.hockey .mid{justify-content:flex-end}.arena.hockey .mid .score{display:none}

.panel{position:absolute;inset:0;z-index:6;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;background:rgba(14,14,14,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;touch-action:auto}
.card{width:min(100%,420px);box-sizing:border-box;background:var(--ink-2);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px;animation:rise2 .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise2{from{transform:translateY(24px);opacity:0}}
.card h2{margin:0;font:800 28px/1.05 var(--display);letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.45}
.names{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.names label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.names label span{display:flex;align-items:center;gap:6px}
.names label i{width:9px;height:9px;border-radius:50%}
.names input{min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:600}
.games{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.game{text-align:left;border-radius:16px;padding:14px;background:var(--ink-3);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.game:active{transform:scale(.97)}
.game:hover{border-color:var(--muted)}
.game .gi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.game .gi svg{width:20px;height:20px}
.game b{font-size:15px}
.game small{font-size:12px;color:var(--muted);line-height:1.35}
.card .btn{width:100%}
.winline{font:800 34px/1.05 var(--display);margin:0;letter-spacing:-.02em}
.tally{display:flex;justify-content:center;gap:18px;font-variant-numeric:tabular-nums;font-weight:700}
.tally span{display:flex;align-items:center;gap:8px}
.tally i{width:10px;height:10px;border-radius:50%}
.tally b{font:800 30px/1 var(--display)}

/* balloon */
.bwrap{display:flex;flex-direction:column;align-items:center;height:min(30vh,230px);justify-content:flex-end}
.balloon{height:min(24vh,180px);aspect-ratio:.84;border-radius:50% 50% 47% 47% / 56% 56% 44% 44%;transform:scale(.3);transform-origin:50% 100%;transition:transform .09s ease-out;position:relative}
.balloon.b0{background:radial-gradient(circle at 32% 28%,#FFD9D1 0 7%,var(--coral) 32%,#B93A2A)}
.balloon.b1{background:radial-gradient(circle at 32% 28%,#D6E8FF 0 7%,var(--sky) 32%,#2A62B8)}
.balloon::after{content:"";position:absolute;bottom:-7px;left:50%;width:14px;height:9px;margin-left:-7px;background:inherit;clip-path:polygon(50% 0,100% 100%,0 100%)}
.balloon.pop{animation:pop .22s forwards}
@keyframes pop{to{transform:scale(1.7);opacity:0;filter:blur(6px)}}
.string{width:2px;height:34px;background:var(--muted);opacity:.45}
.bar{width:min(60%,240px);height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .08s}
.half.p0 .bar i{background:var(--p0)} .half.p1 .bar i{background:var(--p1)}

/* court */
.btn.court{grid-column:1/-1;border:1.5px solid transparent;background:linear-gradient(var(--ink-3),var(--ink-3)) padding-box,linear-gradient(90deg,var(--coral),var(--amber),var(--sky)) border-box}
.btn.court[aria-disabled="true"]{background:var(--ink-3);border-color:var(--line);color:var(--muted);pointer-events:none}
.btn.court svg{width:18px;height:18px}
.poster-wrap{position:relative}
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-12deg);padding:5px 8px;border:2.5px solid var(--amber);border-radius:7px;color:var(--amber);
  font:800 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:rgba(20,20,20,.72);animation:stamp .45s .5s both cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0}}
.objection{margin:0;font:800 44px/1 var(--display);letter-spacing:-.02em;color:var(--amber);transform:rotate(-3deg);animation:slam .45s cubic-bezier(.3,1.6,.5,1)}
.objection.sm{font-size:30px}
@keyframes slam{from{transform:rotate(-3deg) scale(2);opacity:0}}
.court-pick{display:flex;align-items:center;gap:14px;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px}
.court-pick .mini{width:54px;flex:none;aspect-ratio:2/3;border-radius:7px;overflow:hidden}
.court-pick .mini img{width:100%;height:100%;object-fit:cover;display:block}
.court-pick .mini .gp .k,.court-pick .mini .gp .bill{display:none}
.court-pick b{display:block;font-size:17px;line-height:1.2}
.court-pick .eyebrow{font-size:11px;margin-bottom:3px}
.who-btn{display:flex;align-items:center;justify-content:center;gap:8px}
.who-btn i{width:10px;height:10px;border-radius:50%}
.stakes{color:var(--text)!important;font-size:16px}
.verdict{align-self:center;padding:8px 16px;border:3px solid currentColor;border-radius:10px;font:800 34px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;transform:rotate(-6deg);animation:slam .45s cubic-bezier(.3,1.6,.5,1)}
.verdict.sus{color:var(--mint)} .verdict.over{color:var(--coral)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s);
const PAL=['#FF6B57','#FFB43F','#2ED3A0','#4C9DFF','#9A7CFF','#FF6FB0'];
const TAU=Math.PI*2, mod=(a,b)=>((a%b)+b)%b, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULTS={type:'movie',included:[],excluded:[],unwatched:false,watchlist:false,sound:true,names:['Player 1','Player 2']};
const prefs=Object.assign({},DEFAULTS,store.get('rr-prefs',{}));if(!Array.isArray(prefs.included))prefs.included=[];
const save=()=>store.set('rr-prefs',prefs);

/* ---------- sample library ---------- */
const SAMPLE=[

const DCOL=[['#FF6B57','Red'],['#FFB43F','Yellow'],['#2ED3A0','Green'],['#4C9DFF','Blue']];
function dosGame(){
  const deal=()=>Math.random()<.14?{c:Math.floor(Math.random()*4),n:'skip'}:{c:Math.floor(Math.random()*4),n:1+Math.floor(Math.random()*5)};
  const hands=[[deal(),deal(),deal()],[deal(),deal(),deal()]];let pile=deal();while(pile.n==='skip')pile=deal();
  let turn=Math.random()<.5?0:1,drew=false,flash=-1,streak=0,lucky=-1;
  const fits=c=>c.c===pile.c||c.n===pile.n;
  const luckyCard=()=>Math.random()<.5?{c:pile.c,n:1+Math.floor(Math.random()*5)}:{c:Math.floor(Math.random()*4),n:pile.n==='skip'?'skip':pile.n};
  const face=c=>c.n==='skip'?'⊘':c.n;
  const card=(c,extra='',attrs='')=>`<div class="dcard ${extra}" style="background:${DCOL[c.c][0]}" aria-label="${DCOL[c.c][1]} ${c.n==='skip'?'skip':c.n}" ${attrs}>${face(c)}</div>`;
  function render(){[0,1].forEach(p=>{
    const mine=turn===p,h=hands[p];
    setHalf(p,`<p class="who">${esc(name(p))} · ${h.length} card${h.length===1?'':'s'}</p>
      <div class="dos ${mine?'':'wait'}">
        ${flash===p?'<div class="dosflash">DOS!</div>':`<p class="turn">${mine?(lucky===p?'Lucky draw! Play it':drew?'Play it or pass':'Your turn'):'Their turn'}</p>`}
        <div class="pile">On the pile ${card(pile,'sm')}</div>
        <div class="hand">${h.map((c,i)=>card(c,mine?(fits(c)?'ok':'no'):'',`data-i="${i}" role="button" tabindex="0"`)).join('')}</div>
        <div class="row">${mine?(lucky===p?'':drew?'<button class="btn" data-dos="pass">Pass</button>':h.length<8?'<button class="btn" data-dos="draw">Draw a card</button>':'<button class="btn" data-dos="pass">Pass</button>'):''}</div>
      </div>`,mine?'':'wait')})}
  A.onClick=(p,t)=>{if(A.done||p!==turn)return;
    const act=t.closest('[data-dos]'),ci=t.closest('[data-i]');
    if(act){if(act.dataset.dos==='draw'){const forced=streak>=2;hands[p].push(forced?luckyCard():deal());streak++;drew=true;lucky=forced?p:-1;tone(forced?660:330,.05,'triangle',.05);
        if(!hands[p].some(fits)){render();later(()=>{if(turn===p&&!A.done){drew=false;turn=1-p;render()}},700);return}}
      else{drew=false;lucky=-1;turn=1-p;tone(260,.05,'triangle',.04)}
      render();return}
    if(!ci)return;const i=+ci.dataset.i,c=hands[p][i];
    if(!fits(c)){buzz(30);tone(140,.08,'square',.05);return}
    hands[p].splice(i,1);pile=c;drew=false;streak=0;lucky=-1;tone(700,.05,'triangle',.06);buzz(8);
    if(!hands[p].length){render();finish(p,'Out of cards');return}
    if(hands[p].length===1){flash=p;later(()=>{flash=-1;render()},900);tone(990,.12,'triangle',.06)}
    if(c.n!=='skip')turn=1-p;
    render()};
  render();
}
function pongGame(){
  const cv=$('#hockey');cv.hidden=false;$('#arena').classList.add('hockey');
  [0,1].forEach(p=>setHalf(p,''));
  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  const bx=cv.getBoundingClientRect(),W=bx.width,H=bx.height;cv.width=W*dpr;cv.height=H*dpr;
  const PW=W*.3,PH=14,EDGE=Math.max(34,H*.06),r=Math.max(8,W*.026),WIN=3,COL=['#FF6B57','#4C9DFF'];
  const pads=[{x:W/2,y:H-EDGE},{x:W/2,y:EDGE}],pts=[0,0],own={},ball={x:W/2,y:H/2,vx:0,vy:0};
  let pause=900,flash=-2,last=performance.now(),speed=0;
  const pos=e=>{const q=cv.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};
  const setX=(p,x)=>{pads[p].x=clamp(x,PW/2+6,W-PW/2-6)};
  const down=e=>{e.preventDefault();const q=pos(e),p=q.y>H/2?0:1;if(Object.values(own).includes(p))return;own[e.pointerId]=p;try{cv.setPointerCapture(e.pointerId)}catch(_){}setX(p,q.x)};
  const move=e=>{const p=own[e.pointerId];if(p===undefined)return;e.preventDefault();setX(p,pos(e).x)};

async function px(url,{method='GET',token,timeout=15000}={}){
  const headers=plexHeaders(token);let res;
  try{res=await withTimeout(fetch(url,{method,headers}),timeout,'Plex took too long to answer')}
  catch(e){
    if(!S.relay)throw new Error(`Couldn't reach ${new URL(url).hostname}`);
    res=await withTimeout(fetch('api/relay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,method,headers})}),timeout,'Plex took too long to answer');
  }
  if(res.status===401||res.status===403)throw Object.assign(new Error('Plex said no (sign-in expired or not allowed)'),{status:res.status});
  if(!res.ok)throw Object.assign(new Error(`Plex replied ${res.status}`),{status:res.status});
  const txt=await res.text();try{return JSON.parse(txt)}catch(e){return parseXml(txt)}
}

let authCancel=null;
async function plexAuth(purpose){
  let win=null;

  try{pin=await px('https://plex.tv/api/v2/pins?strong=true',{method:'POST'})}

  const q=new URLSearchParams({clientID:CID,code:pin.code,'context[device][product]':PRODUCT});
  if(!NATIVE&&!win){
    q.set('forwardUrl',location.href.split('#')[0]);
    try{sessionStorage.setItem('rr-pending',JSON.stringify({id:pin.id,purpose}))}catch(e){}
    location.href='https://app.plex.tv/auth#?'+q.toString();return new Promise(()=>{});
  }
  const url='https://app.plex.tv/auth#?'+q.toString();
  if(NATIVE&&PLUG('Browser'))await PLUG('Browser').open({url,presentationStyle:'popover'});
  else if(win)win.location.href=url;
  toast('Finish signing in on the Plex page…',{sticky:true,action:'Cancel',onAction:()=>authCancel&&authCancel()});
  try{const t=await pollPin(pin.id);return t}
  finally{hideToast();try{win&&win.close()}catch(_){}try{NATIVE&&PLUG('Browser')&&PLUG('Browser').close()}catch(_){}}
}
function pollPin(id,maxMs=10*60e3){
  return new Promise((resolve,reject)=>{
    let stop=false;authCancel=()=>{stop=true;reject(new Error('Sign-in cancelled'))};
    const t0=Date.now();
    (async()=>{while(!stop&&Date.now()-t0<maxMs){
      await sleep(1500);if(stop)return;
      try{const r=await px(`https://plex.tv/api/v2/pins/${id}`);if(r&&r.authToken){stop=true;authCancel=null;return resolve(r.authToken)}}catch(e){}

async function connectAccount(token){
  const user=await fetchUser(token);
  const r=await px('https://plex.tv/api/v2/resources?includeHttps=1&includeRelay=1',{token});
  const list=(Array.isArray(r)?r:((r.MediaContainer&&r.MediaContainer.Device)||[])).filter(d=>String(d.provides||'').includes('server'));
  if(!list.length)throw new Error("This Plex account can't see any servers yet.");
  const servers=list.map(d=>({name:d.name,id:d.clientIdentifier,accessToken:d.accessToken||token,owned:!!d.owned,
    connections:(d.connections||d.Connection||[]).map(c=>({uri:c.uri,local:!!c.local,relay:!!c.relay,protocol:c.protocol}))}))
    .sort((a,b)=>(b.owned-a.owned));
  const old=ACC||{};
  ACC={token,user,servers,server:null,people:(old.people||[]).filter(p=>p.kind!=='owner')};
  ACC.server=servers.find(s=>old.server&&s.id===old.server.id)||servers[0];

async function findConnection(server){
  const secure=location.protocol==='https:'&&!NATIVE;
  const ok=c=>!(secure&&c.protocol==='http');
  const groups=[server.connections.filter(c=>c.local&&!c.relay),server.connections.filter(c=>!c.local&&!c.relay),server.connections.filter(c=>c.relay)];
  for(const g of groups){
    const cands=g.filter(ok).sort((a,b)=>(a.protocol==='https'?0:1)-(b.protocol==='https'?0:1));
    if(!cands.length)continue;
    try{return await Promise.any(cands.map(c=>px(c.uri+'/identity',{token:server.accessToken,timeout:4500}).then(()=>c)))}catch(e){}
  }
  throw new Error(`Couldn't reach ${server.name}. Make sure it's on, and turn on Remote Access in Plex to use it away from home.`);
}

    $('#source').textContent=`Loading ${s.title}…`;
    const md=(await get(`/library/sections/${s.key}/all`)).MediaContainer.Metadata||[];
    try{((await get(`/library/sections/${s.key}/collections`)).MediaContainer.Metadata||[]).forEach(c=>cols.push({id:c.ratingKey,title:c.title,type:s.type==='movie'?'movie':'show',library:s.title,count:Number(c.childCount)||0}))}catch(e){}
    const gmap=new Map();
    try{
      const gs=(await get(`/library/sections/${s.key}/genre`)).MediaContainer.Directory||[];const q=[...gs];
      const worker=async()=>{while(q.length){const g=q.shift();const r=(await get(`/library/sections/${s.key}/all?genre=${encodeURIComponent(g.key)}`)).MediaContainer.Metadata||[];
        r.forEach(m=>{if(!gmap.has(m.ratingKey))gmap.set(m.ratingKey,new Set());gmap.get(m.ratingKey).add(g.title)})}};
      await Promise.all([worker(),worker(),worker(),worker()]);
    }catch(e){}
    const mv=s.type==='movie';
    for(const m of md){
      const gen=new Set((m.Genre||[]).map(g=>g.tag));(gmap.get(m.ratingKey)||[]).forEach(g=>gen.add(g));
      if(m.guid)guid[m.guid]=m.ratingKey;
      items.push({id:m.ratingKey,type:mv?'movie':'show',title:m.title,year:m.year||null,genres:[...gen],rating:m.audienceRating||m.rating||null,
        contentRating:m.contentRating||'',minutes:mv&&m.duration?Math.round(m.duration/60000):null,seasons:mv?null:(m.childCount||null),summary:m.summary||'',
        watched:mv?(m.viewCount||0)>0:(m.leafCount>0&&m.viewedLeafCount>=m.leafCount),
        inProgress:mv?(m.viewOffset||0)>0:(m.viewedLeafCount>0&&m.viewedLeafCount<m.leafCount),thumb:m.thumb||null,guid:m.guid||'',slug:m.slug||''});
    }
  }
  S.items=items;S.guid=guid;S.collections=cols.filter(c=>c.count!==0).sort((a,b)=>a.library.localeCompare(b.library)||a.title.localeCompare(b.title));S.colIds={};
}
async function watchlistGuids(token){
  for(const host of['https://discover.provider.plex.tv','https://metadata.provider.plex.tv']){
    try{const out=new Set();let start=0,total=Infinity;
      while(start<total){const r=await px(`${host}/library/sections/watchlist/all?includeCollections=1&includeExternalMedia=1&X-Plex-Container-Start=${start}&X-Plex-Container-Size=100`,{token});
        const mc=r.MediaContainer||{},md=mc.Metadata||[];md.forEach(m=>m.guid&&out.add(m.guid));total=Number(mc.totalSize??mc.size??0);start+=100;if(!md.length)break}
      return out}catch(e){}
  }
  return null;
}

/* people */
async function loadHomeMembers(){
  if(!ACC.user.home)return[];
  let list=[];
  try{const r=await px('https://plex.tv/api/v2/home/users',{token:ACC.token});list=Array.isArray(r)?r:(r.users||[])}
  catch(e){try{const r=await px('https://plex.tv/api/home/users',{token:ACC.token});
    if(r.xml)list=[...r.xml.querySelectorAll('User')].map(u=>({id:u.getAttribute('id'),uuid:u.getAttribute('uuid'),title:u.getAttribute('title'),protected:u.getAttribute('protected')==='1'}));
    else list=(r.MediaContainer&&r.MediaContainer.User)||[]}catch(_){}}
  return list.filter(u=>u.uuid&&u.uuid!==ACC.user.uuid).map(u=>({id:'h:'+u.uuid,name:u.title||u.username||u.friendlyName||'Home member',kind:'home',uuid:u.uuid,homeId:u.id,protected:!!(u.protected||u.hasPassword),thumb:u.thumb||''}));
}
async function switchHome(p,pin){
  const qs=pin?`?pin=${encodeURIComponent(pin)}`:'';
  try{const r=await px(`https://plex.tv/api/v2/home/users/${p.uuid}/switch${qs}`,{method:'POST',token:ACC.token});const t=r.authToken||r.authenticationToken;if(t)return t}
  catch(e){if(e.status===401||e.status===403)throw new Error("That PIN didn't work.")}
  const r=await px(`https://plex.tv/api/home/users/${p.homeId}/switch${qs}`,{method:'POST',token:ACC.token});
  const t=r.xml?(r.xml.documentElement.getAttribute('authenticationToken')||r.xml.documentElement.getAttribute('authToken')):(r.authToken||r.authenticationToken);
  if(!t)throw new Error(`Couldn't switch to ${p.name}.`);return t;
}
function setPeople(base){
  S.people=[...base,...GUESTS.map(g=>({id:g.id,name:g.name,kind:'guest'}))];
  if(!S.people.some(p=>p.id===prefs.profile))prefs.profile=S.people[0]&&S.people[0].id;
}
function accountPeople(){return[{id:'me',name:ACC.user.title,kind:'owner',token:ACC.token,thumb:ACC.user.thumb||''},...ACC.people]}
async function ensureWatchlist(p){
  if(S.mode!=='account'||!p||p.kind==='guest'||S.wl[p.id] instanceof Set)return;
  if(p.kind==='home'&&!p.token){
    let pin=null;if(p.protected){pin=await askPin(p.name);if(pin===null)return}
    try{p.token=await switchHome(p,pin);const ap=ACC.people.find(x=>x.id===p.id);if(ap)ap.token=p.token;saveAcc()}
    catch(e){toast(e.message);S.wl[p.id]='fail';return}
  }
  S.wl[p.id]='loading';renderControls();
  const g=await watchlistGuids(p.token);
  S.wl[p.id]=g?new Set([...g].map(x=>S.guid[x]).filter(Boolean)):'fail';
}
async function addPlexPerson(){
  try{const token=await plexAuth('person');await finishAddPerson(token)}catch(e){if(!/cancel/i.test(e.message))toast(e.message)}
}
async function finishAddPerson(token){
  const u=await fetchUser(token);
  if(u.uuid===ACC.user.uuid){toast("That's you. You're already on the list.");return}
  const id='p:'+u.uuid;ACC.people=ACC.people.filter(p=>p.id!==id);ACC.people.push({id,name:u.title,kind:'plex',token,uuid:u.uuid,thumb:u.thumb||''});saveAcc();
  setPeople(accountPeople());prefs.profile=id;save();await ensureWatchlist(S.people.find(p=>p.id===id));
  renderControls();renderSettings();rebuild();toast(`${u.title} added.`);
}

/* modes */
async function startAccount(){
  S.mode='account';S.live=true;S.wl={};S.veto.clear();
  $('#source').textContent='Connecting to Plex…';$('#notice').hidden=true;
  if(!ACC.servers||!ACC.server)await connectAccount(ACC.token);
  let c;try{c=await findConnection(ACC.server)}catch(e){await connectAccount(ACC.token);c=await findConnection(ACC.server)}
  ACC.server.uri=c.uri;ACC.server.via=c.relay?'Relay':c.local?'Local':'Remote';saveAcc();
  S.machineId=ACC.server.id;
  await loadLibraryClient();
  try{const home=await loadHomeMembers();const keep=new Map(ACC.people.map(p=>[p.id,p]));
    ACC.people=[...home.map(h=>Object.assign(h,keep.has(h.id)?{token:keep.get(h.id).token}:{})),...ACC.people.filter(p=>p.kind==='plex')];saveAcc()}catch(e){}
  setPeople(accountPeople());
  if(prefs.collection&&!curCollection())prefs.collection='';ensureCollection(curCollection()).then(()=>rebuild());
  $('#source').textContent=`${ACC.server.name} · ${S.items.length} titles`;
  renderControls();rebuild();renderAcctBtn();
  await ensureWatchlist(S.people.find(p=>p.id===prefs.profile));renderControls();if(prefs.watchlist)rebuild();
}
function startSample(){
  S.mode='sample';S.live=false;S.items=sampleItems();S.guid={};S.wl={};
  const wl=(bit)=>new Set(S.items.filter(i=>i._f&bit).map(i=>i.id));
  S.wl={'s:alex':wl(2),'s:sam':wl(4)};
  const byT=(...ts)=>new Set(S.items.filter(i=>ts.includes(i.title)).map(i=>i.id));
  S.collections=[
    {id:'c:anim',title:'Animated Favorites',type:'movie',library:'Movies',count:3},
    {id:'c:date',title:'Date Night',type:'movie',library:'Movies',count:5},
    {id:'c:nolan',title:'Mind Benders',type:'movie',library:'Movies',count:4},
    {id:'c:comfort',title:'Comfort TV',type:'show',library:'TV Shows',count:5}];
  S.colIds={'c:anim':byT('Spider-Man: Into the Spider-Verse','Coco','Paddington 2'),'c:date':byT('La La Land','Crazy Rich Asians','The Notebook','Barbie','The Grand Budapest Hotel'),
    'c:nolan':byT('Inception','Interstellar','Arrival','Everything Everywhere All at Once'),'c:comfort':byT('The Office','Abbott Elementary','Schitt\'s Creek','Ted Lasso','Only Murders in the Building')};
  setPeople([{id:'s:alex',name:'Alex',kind:'sample'},{id:'s:sam',name:'Sam',kind:'sample'}]);
  $('#source').textContent='Sample library';
  const n=$('#notice');n.hidden=false;n.className='notice';
  n.innerHTML=`<span>This is a sample library. Sign in to spin your own movies and shows.</span><button class="btn primary sm" id="noticeSignIn">Sign in with Plex</button>`;
  $('#noticeSignIn').onclick=signIn;
}
function startNas(cfg,j){
  S.mode='nas';S.live=true;S.machineId=cfg.machineId;S.items=j.items;S.guid={};S.wl={};
  (j.profiles||[]).forEach(p=>{S.wl['n:'+p.name]=p.available?new Set(p.ids||[]):'fail'});
  S.collections=(j.collections||[]).map(c=>({id:c.id,title:c.title,type:c.type,library:c.library,count:(c.ids||[]).length}));S.colIds={};(j.collections||[]).forEach(c=>{S.colIds[c.id]=new Set(c.ids||[])});
  setPeople((j.profiles||[]).map(p=>({id:'n:'+p.name,name:p.name,kind:'nas'})));
  $('#source').textContent=`${cfg.serverName||'Plex'} · ${S.items.length} titles`;
}
async function signIn(){
  try{const token=await plexAuth('owner');await afterOwnerToken(token)}
  catch(e){if(!/cancel/i.test(e.message))showError(e.message)}
}
async function afterOwnerToken(token){
  toast('Signed in. Loading your library…',{sticky:true});
  try{await connectAccount(token);await startAccount();hideToast();closeSettings()}
  catch(e){hideToast();showError(e.message)}
}
function signOut(){
  try{localStorage.removeItem('rr-account')}catch(e){}ACC=null;closeSettings();
  location.reload();
}
function showError(msg){const n=$('#notice');n.hidden=false;n.className='notice err';n.innerHTML=`<span>${esc(msg)}</span><button class="btn sm" id="retryBtn">Try again</button>`;$('#retryBtn').onclick=()=>location.reload()}

/* toast + PIN prompt */
let toastT=0;
function toast(msg,{sticky=false,action,onAction}={}){
  const t=$('#toast');clearTimeout(toastT);
  t.innerHTML=`<span>${esc(msg)}</span>${action?`<button class="textbtn" id="toastAct">${esc(action)}</button>`:''}`;t.hidden=false;
  if(action)$('#toastAct').onclick=()=>{hideToast();onAction&&onAction()};
  if(!sticky)toastT=setTimeout(hideToast,3800);
}
function hideToast(){$('#toast').hidden=true}
function askPin(who){
  return new Promise(resolve=>{
    const m=$('#pinModal');m.hidden=false;$('#pinWho').textContent=`Enter ${who}'s Plex Home PIN`;const inp=$('#pinInput');inp.value='';setTimeout(()=>inp.focus(),50);
    const done=v=>{m.hidden=true;$('#pinForm').onsubmit=null;$('#pinCancel').onclick=null;resolve(v)};
    $('#pinForm').onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(/^\d{4}$/.test(v))done(v);else inp.focus()};
    $('#pinCancel').onclick=()=>done(null);
  });
}

/* settings sheet */
const KIND={owner:'You',home:'Plex Home',plex:'Plex account',guest:'Guest',sample:'Sample profile',nas:'From NAS settings'};
function avatar(p,i,cls=''){return`<span class="av ${cls}" style="background:${PAL[[0,3,2,4,1,5][i%6]]}">${esc((p.name||'?').slice(0,1).toUpperCase())}${p.thumb?`<img src="${esc(p.thumb)}" alt="" referrerpolicy="no-referrer" loading="lazy">`:''}</span>`}
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.parentElement&&t.parentElement.classList.contains('av'))t.remove()},true);
function renderSettings(){
  const b=$('#setBody');let acct='';
  if(S.mode==='account'){
    acct=`<div class="acct">${avatar({name:ACC.user.title,thumb:ACC.user.thumb},0)}<div style="min-width:0"><b>${esc(ACC.user.title)}</b><small>${esc(ACC.server.name)} · ${esc(ACC.server.via||'')}</small></div></div>
      ${ACC.servers.length>1?`<label class="field">Server<select id="srvSel">${ACC.servers.map(s=>`<option value="${esc(s.id)}" ${s.id===ACC.server.id?'selected':''}>${esc(s.name)}${s.owned?'':' (shared)'}</option>`).join('')}</select></label>`:''}
      <div class="actions"><button class="btn" id="refreshBtn">Refresh library</button><button class="btn" id="signOutBtn">Sign out</button></div>`;
  }else{
    acct=`<p class="help">${S.mode==='nas'?'Connected through your NAS settings. Sign in to use your Plex account directly on this device instead.':'Sign in to load your movies, shows, posters and watchlists. Your sign-in stays on this device.'}</p>
      <button class="btn primary" id="setSignIn">Sign in with Plex</button>`;
  }
  const people=S.people.map((p,i)=>`<li>${avatar(p,i)}<div style="min-width:0"><b>${esc(p.name)}</b><small>${KIND[p.kind]||''}${p.kind==='home'&&p.protected?' · PIN':''}</small></div>
    ${p.kind==='plex'||p.kind==='guest'?`<button class="textbtn" data-rm="${esc(p.id)}">Remove</button>`:''}</li>`).join('');
  b.innerHTML=`<h2 class="set-h">Your Plex</h2>${acct}
    <h2 class="set-h">People</h2>
    <p class="help">Pick who's spinning on the main screen. ${S.mode==='account'?'Plex Home members show up on their own.':''}</p>
    <ul class="people">${people}</ul>
    ${S.mode==='account'?`<button class="btn" id="addPlexBtn">Add someone's Plex account</button>`:''}
    <form class="addg" id="guestForm"><input id="guestName" maxlength="14" placeholder="Guest name" autocomplete="off" aria-label="Guest name"><button class="btn" type="submit">Add guest</button></form>
    <h2 class="set-h">App</h2>
    <label class="switch"><input type="checkbox" id="soundSw" ${prefs.sound?'checked':''}> Sound effects</label>
    <p class="fine">Reel Roulette ${VERSION}. Not affiliated with or endorsed by Plex, Inc.</p>`;
  const on=(id,ev,fn)=>{const el=$('#'+id);if(el)el[ev]=fn};
  on('setSignIn','onclick',signIn);
  on('signOutBtn','onclick',signOut);
  on('refreshBtn','onclick',async()=>{closeSettings();try{await startAccount();toast('Library refreshed.')}catch(e){showError(e.message)}});
  on('srvSel','onchange',async e=>{ACC.server=ACC.servers.find(s=>s.id===e.target.value);saveAcc();closeSettings();try{await startAccount()}catch(err){showError(err.message)}});
  on('addPlexBtn','onclick',addPlexPerson);
  on('soundSw','onchange',e=>{prefs.sound=e.target.checked;save();audio()});
  $('#guestForm').onsubmit=e=>{e.preventDefault();const n=$('#guestName').value.trim();if(!n)return;
    const g={id:'g:'+Date.now().toString(36),name:n};GUESTS.push(g);saveGuests();S.people.push({id:g.id,name:n,kind:'guest'});renderSettings();renderControls()};
  b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{const id=x.dataset.rm;
    GUESTS=GUESTS.filter(g=>g.id!==id);saveGuests();if(ACC){ACC.people=ACC.people.filter(p=>p.id!==id);saveAcc()}
    S.people=S.people.filter(p=>p.id!==id);if(prefs.profile===id)prefs.profile=S.people[0]&&S.people[0].id;save();renderSettings();renderControls();rebuild()});
}
function openSettings(){closeSheet();renderSettings();$('#scrim').hidden=false;$('#settings').hidden=false;$('#settings').scrollTop=0}
function closeSettings(){$('#settings').hidden=true;if($('#sheet').hidden)$('#scrim').hidden=true}
function renderAcctBtn(){const b=$('#acctBtn');
  b.innerHTML=S.mode==='account'?avatar({name:ACC.user.title,thumb:ACC.user.thumb},0,'sm'):'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 17a6.5 6.5 0 0 1 13 0" stroke-linecap="round"/></svg>';
  b.setAttribute('aria-label',S.mode==='account'?`Account: ${ACC.user.title}`:'Sign in and people')}
$('#acctBtn').onclick=openSettings;
$('#setX').onclick=closeSettings;

/* in-app links */
document.addEventListener('click',e=>{const a=e.target.closest('a[target="_blank"]');if(!a||!NATIVE||!PLUG('Browser'))return;e.preventDefault();PLUG('Browser').open({url:a.href})});
/* Android back button */
if(NATIVE&&PLUG('App'))PLUG('App').addListener('backButton',()=>{
  if(!$('#pinModal').hidden)return $('#pinCancel').click();
  if(FM)return closeFloat();
  if(!$('#cpick').hidden)return closeColPick();
  if(!$('#pMenu').hidden)return togglePMenu(false);
  if(!$('#arena').hidden){if(!$('#panel').hidden&&!A.court)return closeArena();return $('#exitBtn').click()}
  if(!$('#settings').hidden)return closeSettings();
  if(!$('#sheet').hidden)return closeSheet();
  PLUG('App').minimizeApp&&PLUG('App').minimizeApp();
});

/* ---------- boot ---------- */
async function boot(){
  renderAcctBtn();
  let cfg=null;
  if(!NATIVE){try{const r=await fetch('api/config',{cache:'no-store'});if(r.ok){cfg=await r.json();S.relay=!!cfg.relay}}catch(e){}}
  let pending=null;try{pending=JSON.parse(sessionStorage.getItem('rr-pending')||'null');sessionStorage.removeItem('rr-pending')}catch(e){}
  startSample();renderControls();rebuild();
  try{await document.fonts.ready}catch(e){}draw();
  if(pending){toast('Finishing Plex sign-in…',{sticky:true});
    try{const t=await pollPin(pending.id,60e3);hideToast();if(pending.purpose==='person'&&ACC){await startAccount();await finishAddPerson(t)}else await afterOwnerToken(t);return}
    catch(e){hideToast();showError(e.message)}}
  if(ACC&&ACC.token){try{await startAccount();return}catch(e){showError(`Couldn't load your Plex library: ${e.message}`);return}}
  if(cfg&&cfg.live){try{const r=await fetch('api/library',{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||('Server replied '+r.status));
      $('#notice').hidden=true;startNas(cfg,j);renderControls();rebuild()}
    catch(e){showError(`Couldn't load your Plex library (${e.message}). Check PLEX_URL and PLEX_TOKEN in your Docker settings, or sign in with Plex instead.`)}}
}
boot();
})();
</script>
